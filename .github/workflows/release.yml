name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Apple Silicon Mac binary
        run: |
          mkdir -p dist
          go mod tidy
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -v -o dist/unitevault-binary-arm64 ./cmd/unitevault

      - name: Create macOS .app Bundle
        run: |
          mkdir -p "dist/UniteVault-mac-arm64.app/Contents/MacOS"
          mkdir -p "dist/UniteVault-mac-arm64.app/Contents/Resources"
          cp dist/unitevault-binary-arm64 "dist/UniteVault-mac-arm64.app/Contents/MacOS/UniteVault"
          cp assets/AppIcon.icns "dist/UniteVault-mac-arm64.app/Contents/Resources/AppIcon.icns"
          cat <<EOF > "dist/UniteVault-mac-arm64.app/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>UniteVault</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundleIdentifier</key>
              <string>com.unitevault.app</string>
              <key>CFBundleName</key>
              <string>UniteVault</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>0.0.14</string>
              <key>LSUIElement</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Ad-hoc Sign macOS .app Bundle
        run: |
          codesign --force --deep --sign - "dist/UniteVault-mac-arm64.app" || true

      - name: Zip macOS .app Bundle
        run: |
          (cd dist && zip -r UniteVault-mac-arm64.app.zip UniteVault-mac-arm64.app)

      - name: Build Windows binary & Create ZIP
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags "-H=windowsgui" -o dist/UniteVault.exe ./cmd/unitevault
          (cd dist && zip UniteVault-windows-amd64.zip UniteVault.exe)

      - name: Release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/UniteVault-mac-arm64.app.zip
            dist/UniteVault-windows-amd64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
