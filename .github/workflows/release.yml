name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Apple Silicon Mac binary, create macOS .app Bundle & Ad-hoc Sign
        run: |
          mkdir -p dist

          # Build arm64 binary & .app Bundle (Apple Silicon Mac)
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -o dist/unitevault-binary-arm64 ./cmd/unitevault
          mkdir -p "dist/UniteVault-mac-arm64.app/Contents/MacOS"
          mkdir -p "dist/UniteVault-mac-arm64.app/Contents/Resources"
          cp dist/unitevault-binary-arm64 "dist/UniteVault-mac-arm64.app/Contents/MacOS/UniteVault"
          cp assets/AppIcon.icns "dist/UniteVault-mac-arm64.app/Contents/Resources/AppIcon.icns"
          cat <<EOF > "dist/UniteVault-mac-arm64.app/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>UniteVault</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundleIdentifier</key>
              <string>com.unitevault.app</string>
              <key>CFBundleName</key>
              <string>UniteVault</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>0.0.2</string>
              <key>LSUIElement</key>
              <true/>
          </dict>
          </plist>
          EOF
          codesign --force --deep --sign - "dist/UniteVault-mac-arm64.app"
          (cd dist && zip -r UniteVault-mac-arm64.app.zip UniteVault-mac-arm64.app)

          # Standalone arm64 CLI binary
          cp dist/unitevault-binary-arm64 dist/unitevault-mac-arm64
          codesign --force --deep --sign - dist/unitevault-mac-arm64

      - name: Build Windows binary
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o dist/unitevault-windows-amd64.exe ./cmd/unitevault

      - name: Release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/UniteVault-mac-arm64.app.zip
            dist/unitevault-mac-arm64
            dist/unitevault-windows-amd64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
