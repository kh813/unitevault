name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # The GUI (internal/gui, cmd/unitevault) is built on Fyne, which
      # requires CGO to compile at all - go vet/go test need the same
      # native OpenGL bindings as the real build.
      - name: Build
        run: CGO_ENABLED=1 go build ./...

      - name: Vet
        run: CGO_ENABLED=1 go vet ./...

      - name: Test
        run: CGO_ENABLED=1 go test ./...
