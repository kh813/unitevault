name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # The GUI (internal/gui, cmd/unitevault) is built on Fyne, which
      # requires CGO to compile at all - go vet/go test need the same
      # native OpenGL bindings as the real build.
      - name: Build
        run: CGO_ENABLED=1 go build ./...

      - name: Vet
        run: CGO_ENABLED=1 go vet ./...

      # -p 1 serializes building/running each package's test binary. Without
      # it, this runner has hit a known macOS/Go toolchain race where
      # multiple test binaries link concurrently and dyld aborts some of
      # them with "missing LC_UUID load command" before the binary is fully
      # flushed to disk (not reproducible locally - only seen here).
      - name: Test
        run: CGO_ENABLED=1 go test -p 1 -count=1 ./...
