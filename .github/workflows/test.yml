name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # The GUI (internal/gui, cmd/unitevault) is built on Fyne, which
      # requires CGO to compile at all - go vet/go test need the same
      # native OpenGL bindings as the real build.
      - name: Build
        run: CGO_ENABLED=1 go build ./...

      - name: Vet
        run: CGO_ENABLED=1 go vet ./...

      # This runner deterministically aborts the test binaries for
      # non-cgo packages (bootstrap/config/drive/engine, every run, same
      # order) with "dyld: missing LC_UUID load command" - not reproducible
      # locally, and -p 1 (full serialization) didn't help, ruling out a
      # concurrency race. The packages that DO work (cmd/unitevault,
      # internal/gui) both use cgo, which forces external (clang) linking;
      # everything else uses Go's internal linker by default, which on this
      # runner's toolchain doesn't always emit the LC_UUID load command that
      # newer dyld requires. Forcing external linking for every test binary
      # sidesteps the internal linker entirely.
      - name: Test
        run: CGO_ENABLED=1 go test -ldflags=-linkmode=external -count=1 ./...
